<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="How the Accident Alert Module works step by step." />
  <title>How It Works | Accident Alert Module</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="site-nav">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">Accident Alert Module</a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Overview</a></li>
        <li><a href="how-it-works.html" class="active">How It Works</a></li>
        <li><a href="gallery.html">Gallery</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero small-hero">
    <div class="container">
      <h1>How It Works</h1>
      <p class="subtitle">Sensor input → crash decision → location capture → emergency alert</p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h2>Project Diagrams</h2>
        <div class="gallery-grid">
          <figure class="overlay-card">
            <img src="assets/images/seq_diagram_s.png" alt="Project sequence diagram" />
            <figcaption class="overlay-caption">
              <h3>Sequence Diagram</h3>
              <p>Shows the full event flow from sensing to GSM-based emergency communication.</p>
            </figcaption>
          </figure>

          <figure class="overlay-card">
            <img src="assets/images/use case diagram.png" alt="Project use case diagram" />
            <figcaption class="overlay-caption">
              <h3>Use-Case Diagram</h3>
              <p>Represents system actors and interaction goals for emergency response handling.</p>
            </figcaption>
          </figure>

          <figure class="overlay-card">
            <img src="assets/images/a.a.mod architecture.png" alt="Project architecture diagram" />
            <figcaption class="overlay-caption">
              <h3>Architecture Diagram</h3>
              <p>Illustrates module-level integration between MPU6050, ESP32, GPS, and SIM800L.</p>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="section alt">
      <div class="container">
        <h2>Successful Flow Evidence</h2>
        <div class="gallery-grid">
          <figure class="overlay-card">
            <img src="assets/images/s-attempt-5(gps_lock).png" alt="Successful GPS lock and SMS alert" />
            <figcaption class="overlay-caption">
              <h3>GPS Lock + SMS Sent</h3>
              <p>System acquired GPS lock and successfully sent SMS to emergency contacts/services.</p>
            </figcaption>
          </figure>

          <figure class="overlay-card">
            <img src="assets/images/s-attempts-1.png" alt="Successful short emergency call" />
            <figcaption class="overlay-caption">
              <h3>Short Emergency Call</h3>
              <p>Demonstrates successful call trigger to an emergency number.</p>
            </figcaption>
          </figure>

          <figure class="overlay-card">
            <img src="assets/images/s-attempts-3.png" alt="Successful call and SMS to emergency contacts" />
            <figcaption class="overlay-caption">
              <h3>Call + SMS Success</h3>
              <p>Combined alert mode: both call and message were successfully dispatched.</p>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 Accident Alert Module</p>
    </div>
  </footer>

  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    if (navToggle && navLinks) {
      navToggle.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('show');
        navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    }
  </script>
</body>
</html>
